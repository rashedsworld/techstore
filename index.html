<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rokomari - Online Book & Electronics Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Top Announcement Bar -->
  <div class="bg-blue-900 text-white text-xs py-1.5 px-6 flex justify-between items-center">
    <span>Hotline: <strong>16297</strong> (9.00 AM to 11.00 PM)</span>
    <span>অর্ডার ট্র্যাক করুন | রকমারি স্টার</span>
  </div>

  <!-- Header Navigation -->
  <header class="bg-white shadow-sm border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <!-- Logo -->
      <a href="#" class="text-2xl font-black text-blue-600 flex items-center gap-1">
        <span class="bg-blue-600 text-white px-2 py-0.5 rounded text-xl">র</span> রকমারি
      </a>

      <!-- Search Bar -->
      <div class="flex-1 max-w-2xl flex">
        <input id="search-input" type="text" placeholder="Search by Title or Author..." 
               class="w-full border border-gray-300 rounded-l-md px-4 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
        <button onclick="fetchBooks()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-r-md text-sm font-semibold transition">
          Search
        </button>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-6">
        <button class="text-sm font-medium text-gray-700 hover:text-blue-600 flex items-center gap-1">
          👤 Sign In
        </button>
        <div class="relative cursor-pointer">
          <span class="text-xl">🛒</span>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
        </div>
      </div>
    </div>

    <!-- Category Menu Bar -->
    <nav class="bg-gray-50 border-t text-xs md:text-sm font-medium text-gray-700">
      <div class="max-w-7xl mx-auto px-4 py-2 flex items-center gap-6 overflow-x-auto whitespace-nowrap">
        <button onclick="filterCategory('')" class="hover:text-blue-600 font-bold text-blue-600">সব বই</button>
        <button onclick="filterCategory('Islamic')" class="hover:text-blue-600">ইসলামি বই</button>
        <button onclick="filterCategory('Academic')" class="hover:text-blue-600">একাডেমিক</button>
        <button onclick="filterCategory('Self-Help')" class="hover:text-blue-600">ই-বুক</button>
        <button class="hover:text-blue-600">ইলেক্ট্রনিক্স</button>
        <button class="hover:text-blue-600">স্টেশনারি</button>
      </div>
    </nav>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- Hero Promo Banner -->
    <div class="bg-gradient-to-r from-teal-600 to-emerald-700 text-white rounded-lg p-6 mb-8 shadow-md flex flex-col md:flex-row items-center justify-between gap-4">
      <div>
        <span class="bg-yellow-400 text-teal-900 font-bold text-xs px-2.5 py-1 rounded-full uppercase">বিশেষ অফার</span>
        <h2 class="text-3xl font-extrabold mt-2">বইমেলা ২০২৬ কার্নিভ্যাল!</h2>
        <p class="text-sm text-teal-100 mt-1">নির্বাচিত ইসলামিক ও একাডেমিক বইয়ে <strong>৪০% পর্যন্ত ছাড়</strong>।</p>
      </div>
      <button class="bg-white text-teal-800 font-bold px-6 py-2.5 rounded-md hover:bg-teal-50 transition shadow">
        অফার দেখুন
      </button>
    </div>

    <!-- Category Cards Bar -->
    <section class="mb-8">
      <h3 class="text-lg font-bold mb-4 text-gray-800">Shop By Category</h3>
      <div class="grid grid-cols-3 sm:grid-cols-6 gap-3 text-center">
        <div onclick="filterCategory('')" class="bg-white p-3 rounded-lg border hover:shadow-md cursor-pointer transition">
          <div class="text-2xl mb-1">📚</div>
          <span class="text-xs font-semibold">বই</span>
        </div>
        <div onclick="filterCategory('Academic')" class="bg-white p-3 rounded-lg border hover:shadow-md cursor-pointer transition">
          <div class="text-2xl mb-1">🎓</div>
          <span class="text-xs font-semibold">ভর্তি প্রস্তুতি</span>
        </div>
        <div onclick="filterCategory('Islamic')" class="bg-white p-3 rounded-lg border hover:shadow-md cursor-pointer transition">
          <div class="text-2xl mb-1">🕌</div>
          <span class="text-xs font-semibold">ইসলামি বই</span>
        </div>
        <div class="bg-white p-3 rounded-lg border hover:shadow-md cursor-pointer transition">
          <div class="text-2xl mb-1">🎧</div>
          <span class="text-xs font-semibold">Audiobook</span>
        </div>
        <div class="bg-white p-3 rounded-lg border hover:shadow-md cursor-pointer transition">
          <div class="text-2xl mb-1">💻</div>
          <span class="text-xs font-semibold">Electronics</span>
        </div>
        <div class="bg-white p-3 rounded-lg border hover:shadow-md cursor-pointer transition">
          <div class="text-2xl mb-1">✏️</div>
          <span class="text-xs font-semibold">Stationery</span>
        </div>
      </div>
    </section>

    <!-- Book Grid Section -->
    <section>
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-xl font-bold text-gray-800">সর্বাধিক বিক্রিত বইসমূহ</h3>
      </div>

      <div id="book-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
        <!-- Dynamic Book Cards Inserted Here -->
      </div>
    </section>
  </main>

  <script>
    let cartCount = 0;

    async function fetchBooks(category = '') {
      const searchQuery = document.getElementById('search-input').value;
      let url = 'http://localhost:8000/api/books?';
      if (category) url += `category=${encodeURIComponent(category)}&`;
      if (searchQuery) url += `q=${encodeURIComponent(searchQuery)}`;

      try {
        const res = await fetch(url);
        const books = await res.json();
        
        const grid = document.getElementById('book-grid');
        if (books.length === 0) {
          grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-500">কোনো বই পাওয়া যায়নি।</div>`;
          return;
        }

        grid.innerHTML = books.map(book => `
          <div class="bg-white rounded-lg border hover:shadow-lg transition p-3 flex flex-col justify-between">
            <div>
              <div class="w-full h-48 bg-gray-100 rounded mb-3 overflow-hidden flex items-center justify-center">
                <img src="${book.image_url}" alt="${book.title}" class="h-full object-cover">
              </div>
              <h4 class="font-bold text-sm text-gray-900 line-clamp-1">${book.title}</h4>
              <p class="text-xs text-gray-500 mb-1">${book.author}</p>
              <div class="text-xs text-yellow-500 font-semibold mb-2">⭐ ${book.rating}</div>
            </div>

            <div>
              <div class="flex items-center gap-2 mb-2">
                <span class="text-base font-extrabold text-blue-600">৳${book.discounted_price}</span>
                <span class="text-xs text-gray-400 line-through">৳${book.original_price}</span>
              </div>
              <button onclick="addToCart()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold py-2 rounded transition">
                Add to Cart
              </button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error("Error fetching books:", err);
      }
    }

    function filterCategory(cat) {
      document.getElementById('search-input').value = '';
      fetchBooks(cat);
    }

    function addToCart() {
      cartCount++;
      document.getElementById('cart-count').innerText = cartCount;
    }

    // Initial load
    fetchBooks();
  </script>
</body>
</html>
